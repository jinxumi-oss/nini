[package]
name = "nini-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nini-core = { path = "../nini-core" }
nini-ai = { path = "../nini-ai" }
nini-tools = { path = "../nini-tools" }
nini-session = { path = "../nini-session" }
uuid = { workspace = true }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
pulldown-cmark = { version = "0.13", default-features = false }
notify = "6.1"
nucleo-matcher = "0.3"
arboard = { version = "3", features = ["image-data"] }
png = "0.17"
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
unicode-width = "0.2"
unicode-segmentation = "1.12"
chrono = { workspace = true }
walkdir = "2.5.0"
# v0.10.3: the terminal guard redirects fd 2 to a pipe so the library's
# stderr cannot land on the screen the TUI is painting. `dup`/`pipe`/
# `dup2` are the three calls it needs; libc is already in the lockfile
# as a transitive dependency, so this adds no new download.
libc = "0.2"

[dev-dependencies]
async-trait = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
assert_matches = { workspace = true }
ratatui = { version = "0.29", features = ["crossterm"] }

[lints]
workspace = true
