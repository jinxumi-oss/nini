name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Deny the lints that catch real bugs; allow only the purely
      # stylistic groups we don't gate on.
      #
      # v0.8.9: the previous flag list had `-D clippy::style -D
      # clippy::correctness -D clippy::suspicious` followed by `-A` for
      # the *same* three lints. rustc takes the last flag for a given
      # lint, so every `-D` was cancelled out and this job had been
      # allowing everything — a gate that gated nothing. Deny wins are
      # now listed after the allows so they actually take effect.
      - run: >-
          cargo clippy --workspace --all-targets --
          -A clippy::pedantic
          -A clippy::nursery
          -A clippy::perf
          -A clippy::complexity
          -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      # v0.10: the macOS leg has failed intermittently with SIGSEGV since at
      # least v0.9.1, and a segfault produces no Rust backtrace — the log
      # stops at the last test that printed "ok" and says nothing about the
      # one that died. RUST_BACKTRACE covers panics; the core pattern below
      # covers the case the symboliser would need for an actual SIGSEGV.
      - name: Test
        run: cargo test --workspace --all-targets
        env:
          RUST_BACKTRACE: 1
      - name: Release build
        run: cargo build --release --locked
      # v0.10.2: the delivery profile, checked with the delivery profile.
      #
      # `cargo test --release` is **not** this. Cargo forces
      # `panic = "unwind"` for test targets regardless of the profile, and
      # it also leaves `opt-level = "z"` / `lto` off in favour of the
      # test profile's own settings — so the suite that runs here has never
      # executed the code path a user runs. `--release` at least gives LTO
      # and `opt-level = "z"`, which is where overflow checks disappear
      # and where an `unsafe`-adjacent arithmetic bug becomes silent.
      - name: Test under release profile
        run: cargo test --release --workspace
      # The one check `cargo test` structurally cannot make: whether a
      # **binary** built by the release profile can catch a panic at all.
      # `catch_hook_panic` (`nini-core/src/agent_hooks.rs`) is what keeps
      # a misbehaving user hook from killing the session, and under
      # `panic = "abort"` it is dead code in the shipped binary — with a
      # fully green test suite, because tests unwind no matter what the
      # profile says. An `example` is the only Cargo target that is built
      # by the real profile and is not a test harness.
      - name: Panic strategy of the shipped binary
        run: cargo run --release --example panic_probe -p nini-cli

  cli-smoke:
    name: CLI smoke (no TTY)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Version
        run: ./target/release/nini --version
        # v0.10.2: a release artifact that cannot say what it was built
        # from is the failure `build.rs` exists to prevent, and this is
        # the only place a shipped binary's identity gets checked by
        # something other than a human. A vendored or mis-wired build
        # would print `unknown (unknown)` here and pass every other step.
      - name: Version must name its source
        run: |
          ./target/release/nini --version | tee /tmp/ver
          grep -qE '[0-9a-f]{7,}' /tmp/ver || { echo "no commit in --version"; exit 1; }
          grep -q 'release' /tmp/ver || { echo "not built with the release profile"; exit 1; }
      - name: Help
        run: ./target/release/nini --help
      # Exit 2 is intentional: no TTY + no args means "can't run TUI".
      - name: No-TTY fallback
        run: ./target/release/nini < /dev/null || true
      - name: Print mode
        run: ./target/release/nini --provider fixture -p "smoke test" < /dev/null
      - name: Info
        run: ./target/release/nini info < /dev/null
      - name: Demo
        run: ./target/release/nini demo < /dev/null

  parity-target:
    name: parity target lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          # Pi 0.85.1 的 package.json 要求 node >= 22.19.0（它的工具层用了
          # `node:fs` 的 globSync）。node 20 装得上、跑不起来。
          node-version: '24'
      - name: Install Pi 0.85.1 — the oracle needs the real thing
        # 黄金值是**跑 Pi 自己的代码**产出的（scripts/pi-tool-dump.mjs、
        # scripts/truncate-oracle.mjs、scripts/pi-session-record.sh）。
        # 没有 Pi，这三步只能「跳过并说明」——那等于把最硬的那道门禁变成空话。
        #
        # 版本必须与 references/TARGET.json 一致：Pi 的黄金值只对**那一个**版本成立。
        run: |
          npm i -g @earendil-works/pi-coding-agent@0.85.1
          echo "PI_ROOT=$(npm root -g)/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"
          pi --version
      - name: Install the mock provider's dependency
        # scripts/mock-provider.py 用 aiohttp 起一个假 provider，Pi 会连它。
        # runner 的 python3 默认没有 aiohttp → 录制脚本以「环境不可用」退出。
        run: python3 -m pip install --user aiohttp
      - name: The parity target version is unique and frozen
        # owner 的长期指令：对标只锚定一个版本，直到 owner 宣布解除。
        # 这条规矩必须由机器守住 —— 只写在文档里的规矩会在下一次会话蒸发。
        run: python3 scripts/pi-target-lock.py
      - name: Every Pi citation resolves inside the target snapshot
        run: python3 scripts/pi-oracle-lock.py --check --verify-refs
      - name: The plan and the ledger agree
        run: |
          python3 scripts/parity-gap.py --check-plan docs/plans/parity-with-pi.md
          python3 scripts/plan-selfcheck.py
      - name: Tool-parity board
        # 工具对标计划（docs/plans/tool-parity.md）的判据看板。
        # 2026-10-23：T1–T4 全部完成（5/5 绿），所以它从**报告**升级为**硬门禁**——
        # 往后谁把工具契约改歪了，CI 会直接红。
        run: python3 scripts/tool-parity-check.py
      - name: The target snapshot is what it claims to be
        # 快照目录里的文件由 SNAPSHOT.lock 的 sha256 管辖（上面的 pi-oracle-lock --check
        # 已经查过）；这里查的是**从源码读出的近似契约**有没有漂——它住在
        # references/derived/ 下，不在快照目录里，因此不会与运行时黄金值抢同一个文件。
        run: |
          python3 scripts/pi-tool-contracts.py --extract
          git diff --exit-code -- references/derived/tool-contracts.from-source.json \
            || (echo "源码级工具契约与快照不一致——快照被改过？" && exit 1)
      - name: The Pi session fixture is reproducible (in shape)
        # fixture 是**真 Pi 0.85.1** 写的（scripts/pi-session-record.sh 驱动）。
        # 时间戳与 id 每次都不同，所以比的是**结构**：条目类型与 role 序列。
        # 这一步保证：fixture 不会在某天悄悄变成手写样本。
        run: |
          bash scripts/pi-session-record.sh --out /tmp/rec.jsonl
          python3 - <<'PY'
          import json, sys
          def shape(path):
              out = []
              for line in open(path, encoding="utf-8"):
                  if not line.strip():
                      continue
                  d = json.loads(line)
                  if d.get("type") == "message":
                      out.append("message:" + str(d["message"].get("role")))
                      for b in d["message"].get("content") or []:
                          if isinstance(b, dict) and b.get("type") not in (None, "text"):
                              out.append("block:" + b["type"])
                  else:
                      out.append(str(d.get("type")))
              return out
          a = shape("/tmp/rec.jsonl")
          b = shape("crates/nini-conformance/fixtures/pi-0.85.1-session.jsonl")
          assert a == b, f"重录的结构与已提交的 fixture 不一致:\n{a}\n{b}"
          print("结构一致：", " ".join(b))
          PY
      - name: The Pi-side gold values are reproducible
        # 工具契约与截断的期望值是**执行 Pi 自己的代码**产出的。
        # 这一步保证：改了实现却没重录期望值，会被 CI 抓到。
        run: |
          node scripts/pi-tool-dump.mjs --pi-root "$PI_ROOT"
          node scripts/truncate-oracle.mjs --pi-root "$PI_ROOT"
          git diff --exit-code -- references/pi-0.85.1/tool-contracts.json \
                             references/pi-0.85.1/truncate-oracle.json \
            || (echo "Pi 侧黄金值与快照不一致——重新生成过？" && exit 1)
      - name: A long task must reach its delivery (nini vs Pi 0.85.1)
        # 这条门禁钉住的是「长任务不许在半路被截断」。
        # nini 曾经给一次 run 设了 50 轮硬上限：60 步的任务会死在
        # `too many tool iterations (50)` 上，transcript 里没有答案。
        # Pi 0.85.1 没有这个上限——同一个剧本它会做完。
        # 两边都跑，比的是**请求次数**：屏幕只能说明末态，mock 的日志
        # 才能说明「模型到底被叫了几次」。
        run: |
          cargo build --release --locked
          bash scripts/e2e-long-task.sh
